name: Verify recovered Riftbound launch illustrations
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-launch-artwork.mjs'
      - '.github/workflows/launch-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riftbound-launch-art
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovered original artwork
        run: node scripts/upgrade-launch-artwork.mjs
      - name: Render and validate
        run: |
          npm run build
          npm test
      - name: Publish complete upgraded site
        run: |
          git config user.name "riftbound-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles assets/covers index.html chapters.html gaming.html about.html stories assets/favicon.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install six original cinematic launch article covers"
          git pull --rebase origin main
          git push origin HEAD:main
