name: Publish RIFTBOUND daily edition
on:
  schedule:
    - cron: '15 11 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: riftbound-editorial
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      publish: ${{ steps.window.outputs.publish }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publisher syntax before API calls
        run: npm run check
      - name: Check Toronto publication window and existing issue
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/Toronto date +%H)
          DATE=$(TZ=America/Toronto date +%F)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" != "07" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f "content/editions/$DATE.json" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Research and generate six articles and original covers
        if: steps.window.outputs.publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/publish.mjs
      - name: Build and validate
        run: |
          npm run build
          npm test
      - name: Commit complete issue only after validation
        id: commit
        if: steps.window.outputs.publish == 'true'
        run: |
          git config user.name "riftbound-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles content/editions assets/covers index.html chapters.html gaming.html about.html stories assets/favicon.svg
          git commit -m "Publish RIFTBOUND daily issue $(TZ=America/Toronto date +%F)"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during generation. Refusing to publish stale rendered pages. Rerun this workflow."
            exit 1
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: edition
    if: needs.edition.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ needs.edition.outputs.commit }}
