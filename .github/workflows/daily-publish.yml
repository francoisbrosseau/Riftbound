name: Publish RIFTBOUND daily edition
on:
  schedule:
    # Start overnight so generation and delayed schedules have time before morning.
    # Recovery windows reuse validated checkpoints; dated editions skip generation.
    - cron: '17 1,3,5,7,8,9,10,11,12,14,16 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['.github/recover-daily-edition']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: riftbound-editorial
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      publish: ${{ steps.window.outputs.publish }}
      commit: ${{ steps.commit.outputs.sha || steps.window.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publisher syntax before API calls
        run: npm run check
      - name: Check Toronto publication window and existing issue
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/Toronto date +%H)
          DATE=$(TZ=America/Toronto date +%F)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" -lt 1 ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f "content/editions/$DATE.json" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "generate=true" >> "$GITHUB_OUTPUT"
      - name: Select checkpoint date
        id: date
        run: echo "value=$(TZ=America/Toronto date +%F)" >> "$GITHUB_OUTPUT"
      - name: Recover validated articles and original covers
        if: steps.window.outputs.generate == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .riftbound-runs
          key: riftbound-${{ steps.date.outputs.value }}-${{ hashFiles('scripts/publish.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: riftbound-${{ steps.date.outputs.value }}-${{ hashFiles('scripts/publish.mjs') }}-
      - name: Research and generate six articles and original covers
        if: steps.window.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/publish.mjs
      - name: Save validated progress even when a later article fails
        if: always() && steps.window.outputs.generate == 'true'
        uses: actions/cache/save@v4
        with:
          path: .riftbound-runs
          key: riftbound-${{ steps.date.outputs.value }}-${{ hashFiles('scripts/publish.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and validate
        run: |
          npm run build
          npm test
      - name: Commit complete issue only after validation
        id: commit
        if: steps.window.outputs.generate == 'true'
        run: |
          git config user.name "riftbound-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles content/editions assets/covers index.html chapters.html gaming.html about.html stories assets/favicon.svg
          git commit -m "Publish RIFTBOUND daily issue $(TZ=America/Toronto date +%F)"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during generation. Refusing to publish stale rendered pages. Rerun this workflow."
            exit 1
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: edition
    if: needs.edition.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ needs.edition.outputs.commit }}
  verify:
    needs: [edition, deploy]
    if: needs.edition.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.edition.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-live.mjs
