name: Publish RIFTBOUND daily edition
on:
  schedule:
    - cron: '15 11 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riftbound-editorial
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Toronto publication window and existing issue
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/Toronto date +%H)
          DATE=$(TZ=America/Toronto date +%F)
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$HOUR" != "07" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f "content/editions/$DATE.json" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Generate original edition and six covers
        if: steps.window.outputs.publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/daily-publish.mjs
      - name: Build and validate
        if: steps.window.outputs.publish == 'true'
        run: |
          npm run build
          npm test
      - name: Commit complete issue only after validation
        if: steps.window.outputs.publish == 'true'
        run: |
          git config user.name "riftbound-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles content/editions assets/covers index.html chapters.html gaming.html about.html stories assets/favicon.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish RIFTBOUND daily issue $(TZ=America/Toronto date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
